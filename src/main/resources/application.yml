server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:${user.dir}/data/rag.db
    driver-class-name: org.sqlite.JDBC

rag:
  docs-dir: ./docs
  store-path: ./data/vector-store.json

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: localRagDemoBot

# 多模态配置 - 通义千问 Qwen-VL
vision:
  api:
    # Qwen-VL API密钥（阿里云百炼平台获取 https://bailian.console.aliyun.com/）
    key: ${QWEN_API_KEY:${DEEPSEEK_API_KEY}}
    url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
  # qwen-vl-plus: 性价比高 | qwen-vl-max: 更强 | qwen2.5-vl-72b-instruct: 最强
  model: qwen-vl-plus

speech:
  api:
    key: ${QWEN_API_KEY}

# 图片生成 - 通义万相/千问 Image
image:
  api:
    key: ${QWEN_API_KEY}
  # qwen-image-2.0-pro | wan2.7-image-pro
  model: qwen-image-2.0-pro
